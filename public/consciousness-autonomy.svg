<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" role="img" aria-labelledby="title desc">
  <title id="title">Consciousness autonomy</title>
  <desc id="desc">Reclaim attention from screens and notifications</desc>

  <!-- soft backdrop -->
  <rect width="200" height="100" rx="12" fill="#EEF0FA"/>

  <!-- muted phone (left) -->
  <g transform="translate(22 18)">
    <rect x="0" y="0" width="42" height="64" rx="6" fill="#3F51B5" opacity="0.35"/>
    <rect x="3" y="8" width="36" height="44" rx="2" fill="#C5CAE9"/>
    <!-- grayscale bars suggesting feed -->
    <rect x="7" y="13" width="28" height="4" rx="1" fill="#9FA8DA"/>
    <rect x="7" y="20" width="20" height="4" rx="1" fill="#9FA8DA"/>
    <rect x="7" y="27" width="24" height="4" rx="1" fill="#9FA8DA"/>
    <rect x="7" y="34" width="16" height="4" rx="1" fill="#9FA8DA"/>
    <circle cx="21" cy="58" r="2.5" fill="#7986CB" opacity="0.6"/>
    <!-- slash: reclaiming / muting -->
    <line x1="-4" y1="68" x2="46" y2="-4" stroke="#5C6BC0" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- notification waves fading out -->
  <g transform="translate(72 28)" fill="none" stroke="#7986CB" stroke-linecap="round" opacity="0.45">
    <path d="M0 20 Q8 10 0 0" stroke-width="2"/>
    <path d="M8 24 Q20 12 8 -4" stroke-width="1.6" opacity="0.7"/>
    <path d="M16 28 Q32 12 16 -8" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- calm head / mind (right) -->
  <g transform="translate(118 12)">
    <!-- head -->
    <ellipse cx="34" cy="36" rx="28" ry="32" fill="#5C6BC0"/>
    <!-- face highlight -->
    <ellipse cx="38" cy="34" rx="18" ry="22" fill="#7986CB"/>
    <!-- mindful eye: clear open awareness -->
    <ellipse cx="42" cy="32" rx="10" ry="7" fill="#E8EAF6"/>
    <circle cx="44" cy="32" r="4.5" fill="#283593"/>
    <circle cx="45.5" cy="30.5" r="1.5" fill="#FFFFFF"/>
    <!-- calm smile -->
    <path d="M34 44 Q42 50 50 44" fill="none" stroke="#E8EAF6" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- attention orb above (reclaimed focus) -->
    <circle cx="34" cy="2" r="7" fill="#FFD54F"/>
    <circle cx="34" cy="2" r="3.5" fill="#FFF8E1"/>
    <!-- soft rays -->
    <g stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <line x1="34" y1="-10" x2="34" y2="-14"/>
      <line x1="24" y1="-4" x2="20" y2="-8"/>
      <line x1="44" y1="-4" x2="48" y2="-8"/>
    </g>
  </g>
</svg>
